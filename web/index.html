<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%235eead4'/%3E%3Ccircle cx='11' cy='12' r='4' fill='%230b0e13'/%3E%3Ccircle cx='21' cy='19' r='4' fill='%230b0e13'/%3E%3C/svg%3E" />
<title>SplatForge Studio — 3D 高斯泼溅生成器</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #131820;
    --panel-2: #1a212c;
    --line: #26303d;
    --text: #e7edf5;
    --muted: #8b98a9;
    --accent: #5eead4;
    --accent-2: #38bdf8;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Inter", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app { display: grid; grid-template-columns: 336px 1fr; height: 100vh; }

  /* ---------------- sidebar ---------------- */
  #panel {
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 18px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
  header h1 span { color: var(--accent); font-weight: 500; }
  header .sub { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

  .card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .7px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .lbl b { color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; }

  select, input[type=range], input[type=number] { width: 100%; }
  select {
    background: #0e131a;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
  }
  input[type=range] { accent-color: var(--accent); }

  button {
    font: inherit;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #0e131a;
    color: var(--text);
    padding: 9px 12px;
    cursor: pointer;
    transition: border-color .15s, background .15s, opacity .15s;
  }
  button:hover:not(:disabled) { border-color: #3b4a5e; background: #121924; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #04141a;
    border: none;
    font-weight: 650;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.07); }

  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1;
    padding: 7px 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .seg button.on {
    color: #04141a;
    background: var(--accent);
    border-color: transparent;
    font-weight: 600;
  }

  .row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--muted);
  }
  .row b { color: var(--text); font-variant-numeric: tabular-nums; }

  .status { font-size: 12px; color: var(--muted); min-height: 1.2em; }
  .status.err { color: #f87171; }
  .status.ok { color: var(--accent); }

  .note {
    font-size: 11.5px;
    color: var(--muted);
    border-left: 2px solid var(--line);
    padding-left: 8px;
  }

  /* inference result */
  .imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .imgs.single { grid-template-columns: 1fr; }
  figure { margin: 0; }
  figure img { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: block; }
  figcaption { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 3px; }
  video { width: 100%; border-radius: 6px; border: 1px solid var(--line); margin-top: 4px; }

  footer { color: var(--muted); font-size: 11.5px; line-height: 1.7; }

  /* ---------------- stage ---------------- */
  #stage { position: relative; background: #000; }
  #canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #canvas:active { cursor: grabbing; }

  .drop {
    position: absolute; inset: 14px;
    border: 2px dashed var(--accent);
    border-radius: 14px;
    background: rgba(94, 234, 212, .08);
    color: var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    pointer-events: none;
  }
  .drop.on { display: flex; }

  .toast {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: rgba(10, 15, 22, .92);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
  }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1>SplatForge <span>Studio</span></h1>
      <p class="sub">3D Gaussian Splatting · 浏览器实时生成</p>
    </header>

    <section class="card">
      <label class="lbl" for="sceneSelect">已训练模型 / Trained model</label>
      <select id="sceneSelect"></select>
      <button id="generateBtn" class="primary">生成 3D 对象 / Generate</button>
      <div id="loadStatus" class="status">正在读取模型列表…</div>
    </section>

    <section class="card">
      <div class="row"><span>高斯数量 / Gaussians</span><b id="statCount">—</b></div>
      <div class="row"><span>帧率 / FPS</span><b id="statFps">—</b></div>
      <div class="row"><span>排序 / sort</span><b id="statSort">—</b></div>
      <div class="row"><span>训练 val PSNR</span><b id="statPsnr">—</b></div>
    </section>

    <section class="card">
      <label class="lbl">背景 / Background</label>
      <div class="seg" id="bgSeg">
        <button data-bg="1,1,1" class="on">白</button>
        <button data-bg="0.06,0.07,0.09">暗</button>
        <button data-bg="0,0,0">黑</button>
      </div>

      <label class="lbl">高斯尺度 / Splat scale <b id="scaleVal">1.00×</b></label>
      <input type="range" id="scaleRange" min="0.3" max="2" step="0.05" value="1" />

      <label class="lbl">视角相关颜色 / SH degree</label>
      <div class="seg" id="shSeg">
        <button data-sh="3" class="on">3 (完整)</button>
        <button data-sh="1">1</button>
        <button data-sh="0">0 (DC)</button>
      </div>

      <label class="lbl">排序策略 / Depth sort</label>
      <div class="seg" id="sortSeg">
        <button data-sort="continuous" class="on">连续</button>
        <button data-sort="release">松手时</button>
        <button data-sort="none">关闭</button>
      </div>
    </section>

    <section class="card">
      <label class="lbl">PyTorch 推理 / Inference (GPU 1)</label>
      <div class="seg" id="modeSeg">
        <button data-mode="test" class="on">留出视角</button>
        <button data-mode="novel">环绕新视角</button>
      </div>
      <label class="lbl">视角序号 / view index <b id="idxVal">0</b></label>
      <input type="range" id="idxRange" min="0" max="7" step="1" value="0" />
      <button id="inferBtn">运行推理 / Run inference</button>
      <div id="inferStatus" class="status"></div>
      <div id="inferOut" class="imgs"></div>
      <div id="videoWrap"></div>
    </section>

    <footer>
      拖拽旋转 · 滚轮缩放 · Shift/右键拖拽平移<br />
      也可直接把 3DGS <code>.ply</code> 文件拖进窗口渲染
    </footer>
  </aside>

  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="drop" class="drop">松开以加载 3DGS PLY / Drop to load</div>
    <div id="toast" class="toast"></div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
